[project]
name = "agentevalops-monorepo"
version = "0.1.0"
description = "Multi-tenant AI-agent evaluation and LLMOps platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.17",
    "agentevalops-sdk",
    "agentevalops-schemas",
    "agentevalops-eval",
    "agentevalops-api",
    "agentevalops-workers",
    "agentevalops-ml-failure-prediction",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/python-sdk",
    "packages/shared-schemas",
    "packages/evaluator-core",
    "services/workers",
    "ml/failure-prediction",
]

[tool.uv.sources]
agentevalops-schemas = { workspace = true }
agentevalops-eval = { workspace = true }
agentevalops-sdk = { workspace = true }
agentevalops-api = { workspace = true }
agentevalops-workers = { workspace = true }
agentevalops-ml-failure-prediction = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-redis>=4.6.0.20241004",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
ml = [
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["agentevalops", "agentevalops_schemas", "agentevalops_eval", "agentevalops_ml", "app"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "apps/api", "packages/python-sdk", "packages/evaluator-core"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    ".",
    "apps/api",
    "packages/python-sdk/src",
    "packages/shared-schemas/src",
    "packages/evaluator-core/src",
    "ml/failure-prediction/src",
    "services/workers",
]
