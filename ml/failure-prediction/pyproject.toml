[project]
name = "agentevalops-ml-failure-prediction"
version = "0.1.0"
description = "Machine Learning research package for agent trajectory failure prediction"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentevalops_ml"]
