[project]
name = "agentevalops-ml-failure-prediction"
version = "0.1.0"
description = "Machine Learning research package for agent trajectory failure prediction"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

