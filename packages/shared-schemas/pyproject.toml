[project]
name = "agentevalops-schemas"
version = "0.1.0"
description = "Normalized data schemas and Pydantic models for AgentEvalOps"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentevalops_schemas"]
