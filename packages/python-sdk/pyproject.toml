[project]
name = "agentevalops-sdk"
version = "0.1.0"
description = "Official Python SDK for AgentEvalOps Platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentevalops"]
