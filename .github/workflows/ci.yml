name: AgentEvalOps CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  python-quality-and-tests:
    name: Python Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Monorepo Dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,test,docs,ml]" -e packages/shared-schemas -e packages/python-sdk -e packages/evaluator-core -e apps/api -e services/workers -e ml/failure-prediction

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy Type Checker
        run: uv run mypy apps/api packages/

      - name: Run Pytest Suite
        run: uv run pytest

  frontend-quality-and-build:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm --prefix apps/web ci

      - name: Run ESLint
        run: npm --prefix apps/web run lint

      - name: Run TypeScript Check
        run: npm --prefix apps/web run typecheck

      - name: Build Next.js Web App
        run: npm --prefix apps/web run build
